# nginx configuration for hosting the GrubMarket redesign on an internal server.
# Replicates vercel.json and adds the authentication Vercel handled outside the
# project. Adjust server_name and root, then include from your sites-enabled.

server {
    listen 443 ssl http2;
    server_name  grubmarket.internal.example.com;   # <-- set this

    root /var/www/grubmarket-redesign;
    index index.html;

    # ssl_certificate     /etc/ssl/certs/your.crt;
    # ssl_certificate_key /etc/ssl/private/your.key;

    # ---- Authentication -----------------------------------------------------
    # The right layer for a static site: checked on every request, including a
    # direct hit on /investors.html. A JavaScript login would be bypassable by
    # viewing source or requesting the file directly.
    #
    #   htpasswd -c /etc/nginx/.htpasswd grubmarket
    #
    # If the server is only reachable inside the corporate network, consider
    # whether network access control is already sufficient and this is redundant.
    auth_basic           "GrubMarket redesign (internal preview)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ---- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Keep while the site carries placeholder investor content.
    add_header X-Robots-Tag            "noindex, nofollow"               always;
    # 'unsafe-inline' is needed for style-src only — 67 inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- Redirects ----------------------------------------------------------
    location = /awards.html { return 308 /recognition.html; }
    location = /awards      { return 308 /recognition.html; }

    # ---- Caching ------------------------------------------------------------
    # Font filenames are stable and their contents never change.
    location ^~ /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ ^/assets/(img|icons)/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }
    # css/js use ?v= cache-busting, so they can be cached hard.
    location ~ ^/(css|js)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Serve webp and woff2 with the right types. Most builds already do; confirm
# with:  grep -E 'webp|woff2' /etc/nginx/mime.types
# If missing, add to the types { } block:
#   image/webp  webp;
#   font/woff2  woff2;
